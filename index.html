<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky</title>
<link rel="stylesheet" href="/stage.css">
<style>
  html, body { margin: 0; background: #000; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #app { width: 100%; visibility: hidden; }
  #app.ready { visibility: visible; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/stage.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var room = q.get('r') || 'default';
  var live = q.get('live') === '1'; // 테스트용: 켜면 2초마다 자동 갱신
  var parts = Stage.build(document.getElementById('app'));
  var app = document.getElementById('app');
  var last = null;

  function apply(state) {
    var key = JSON.stringify(state);
    if (key === last) return;
    last = key;
    Stage.show(parts, state);
    parts.img.onload = function () {
      app.classList.add('ready');
      if (state.revealed) Stage.fit(parts.name);
    };
    if (parts.img.complete) app.classList.add('ready');
  }

  function load() {
    return fetch('/api/state?r=' + encodeURIComponent(room), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () { if (last === null) apply({ revealed: false }); });
  }

  // 사진 2를 미리 받아 둬서, 다시 열었을 때 바로 바뀌게 합니다.
  function preload() { var i = new Image(); i.src = '/img2.jpg'; }

  load().then(preload);

  // 화면을 다시 볼 때(앱 전환, 새로고침, 뒤로가기 복귀)마다 한 번만 확인합니다.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load();
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) load(); });
  window.addEventListener('focus', load);
  if (live) setInterval(load, 2000);
})();
</script>
</body>
</html>
