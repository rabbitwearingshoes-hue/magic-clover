<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky</title>
<link rel="stylesheet" href="/stage.css">
<style>
  html, body { margin: 0; background: #000; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #app { width: 100%; visibility: hidden; }
  #app.ready { visibility: visible; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/stage.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var room = q.get('r') || 'default';
  var live = q.get('live') === '1'; // 테스트용: 켜면 2초마다 자동 갱신
  var parts = Stage.build(document.getElementById('app'));
  var app = document.getElementById('app');
  var last = null;      // 마지막으로 받은 상태(문자열)
  var lastState = null; // 마지막으로 받은 상태(객체)

  function reveal(state) {
    app.classList.add('ready');
    if (state && state.revealed) Stage.fit(parts.name);
  }

  // 화면을 가립니다. 화면이 꺼지거나 앱을 벗어나는 순간에 호출해서,
  // 다시 돌아왔을 때 옛날 사진이 잠깐 비치지 않게 합니다.
  function cover() { app.classList.remove('ready'); }

  function apply(state) {
    var key = JSON.stringify(state);
    if (key !== last) {
      last = key;
      lastState = state;
      Stage.show(parts, state);
    }
    var img = parts.img;
    if (img.complete && img.naturalWidth > 0) {
      reveal(state);
    } else {
      img.onload = function () { reveal(state); };
    }
  }

  function load() {
    return fetch('/api/state?r=' + encodeURIComponent(room), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () { if (last === null) apply({ revealed: false }); });
  }

  // 서버가 느려도 화면이 계속 까맣게 남지 않도록, 2.5초가 지나면 가진 걸로 보여 줍니다.
  function refreshCovered() {
    cover();
    var timer = setTimeout(function () {
      if (last === null) apply({ revealed: false });
      else reveal(lastState);
    }, 2500);
    load().then(function () { clearTimeout(timer); });
  }

  // 사진 2를 미리 받아 둬서, 다시 열었을 때 바로 바뀌게 합니다.
  function preload() { var i = new Image(); i.src = '/img2.jpg'; }

  refreshCovered();
  load().then(preload);

  // 화면이 꺼지거나 다른 앱으로 가면 가리고, 다시 돌아오면 확인이 끝난 뒤에 보여 줍니다.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') cover();
    else refreshCovered();
  });
  window.addEventListener('pagehide', cover);
  window.addEventListener('pageshow', function (e) { if (e.persisted) refreshCovered(); });
  document.addEventListener('freeze', cover);
  document.addEventListener('resume', refreshCovered);
  window.addEventListener('focus', load);
  if (live) setInterval(load, 2000);
})();
</script>
</body>
</html>
