<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky</title>
<style>
  html, body { margin: 0; background: #000; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #app { width: 100%; visibility: hidden; }
  #app.ready { visibility: visible; }
  #photo { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<div id="app"><img id="photo" alt="" draggable="false"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var room = q.get('r') || 'default';
  var live = q.get('live') === '1'; // 테스트용: 켜면 2초마다 자동 갱신
  var app = document.getElementById('app');
  var img = document.getElementById('photo');
  var lastState = null;
  var timer = null;

  // 글씨는 이미 사진 속에 합성되어 있습니다. 여기서는 사진 한 장만 바꿔서 보여 줍니다.
  function srcFor(s) {
    return s && s.revealed ? '/api/photo?r=' + encodeURIComponent(room) + '&v=' + (s.v || 0) : '/img1.jpg';
  }

  // 같은 사진을 동시에 두 번 요청하지 않도록, 진행 중인 요청을 공유합니다.
  var pendingSrc = null, pendingP = null;
  function show(src) {
    var cur = img.getAttribute('src');
    if (cur === src && img.complete && img.naturalWidth > 0) return Promise.resolve();
    if (pendingSrc === src) return pendingP;
    pendingSrc = src;
    pendingP = new Promise(function (resolve) {
      img.onload = img.onerror = function () {
        img.onload = img.onerror = null;
        pendingSrc = pendingP = null;
        resolve();
      };
      if (cur !== src || (img.complete && img.naturalWidth === 0)) img.src = src;
    });
    return pendingP;
  }

  function reveal() { clearTimeout(timer); app.classList.add('ready'); }

  // 화면이 꺼지거나 앱을 벗어나는 순간 사진을 가려서, 돌아왔을 때 옛날 사진이 잠깐 비치지 않게 합니다.
  function cover() { clearTimeout(timer); app.classList.remove('ready'); }

  function apply(state) {
    lastState = state;
    return show(srcFor(state)).then(reveal);
  }

  function load() {
    return fetch('/api/state?r=' + encodeURIComponent(room), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () {
        if (lastState === null) return apply({ revealed: false });
        reveal();
      });
  }

  // 확인이 끝나기 전에는 가려 두되, 인터넷이 아주 느려도 화면이 계속 까맣게 남지는 않게 합니다(5초).
  function refreshCovered() {
    cover();
    timer = setTimeout(function () {
      if (lastState === null) apply({ revealed: false }); else reveal();
    }, 5000);
    return load();
  }

  refreshCovered();

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') cover();
    else refreshCovered();
  });
  window.addEventListener('pagehide', cover);
  window.addEventListener('pageshow', function (e) { if (e.persisted) refreshCovered(); });
  document.addEventListener('freeze', cover);
  document.addEventListener('resume', refreshCovered);
  window.addEventListener('focus', load);
  if (live) setInterval(load, 2000);
})();
</script>
</body>
</html>
